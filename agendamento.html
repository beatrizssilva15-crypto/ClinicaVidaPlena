<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Clínica Vida Plena</title>
</head>
<body>
    <header>
        <h1>Clínica Vida Plena</h1>
        <nav>
            <a href="index.html">Início</a> 
            <a href="agendamento.html">Agendamento</a>
        </nav>
    </header>
    <main>
        <h2>Agende sua consulta</h2>
        <form action="#" method="post">
            <label for="nome">Nome Completo:</label>
            <input type="text" name="nome" id="nome" required
            inputmode="numeric" maxlength="15" pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}"
            title="Digite com o DDD. Ex: (17) 98782-2663 ou 17987822663 ">
            <br>
            <br>
            <label for="email">Email</label>
            <input type="email" name="email" id="email">
            <br>
            <br>
            <label for="telefone">Telefone</label>
            <input  type="tel" name="telefone" id="telefone" required>
            <br>
            <br>
            <label for="data">data</label>
            <input type="date" name="data" id="data" required>
            <br>
            <br>
            <label for="hora">Horário </label>
            <input type="time" name="hora" id="hora" required>
            <br>
            <br>
            <label for="especialidades">Especialidades</label>
            <select name="especialidades" id="especialidades" required>
                <option value=""> Selecione uma opção</option>
                <option value="clinico-geral">Clínico Geral</option>
                <option value="cardiologia">Cardiologia</option>
                <option value="demartologia">dermatologia</option>                
                <option value="pediatria">Pediatria</option>                
            </select>
            <br>
            <br>
            <label for="Mensagem">Mensagem:</label>
            <textarea name="Mensagem" id="Mensagem" rows="4"></textarea>
            <br>
            <br>
            <button type="submit">Confirmar Agendamento</button>

        </form>
    </main>

    <footer>
        <p>
            Clínica Vida Plena - Todos os direitos reservado.
        </p>
    </footer>
    
</body>
</html>
